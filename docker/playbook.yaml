# Secrets live in vault-encrypted files, not in vars/main.yaml or the .j2 templates directly:
#   - group_vars/all/vault.yml           shared secrets (e.g. SMTP creds used by ghost_deploy + vaultwarden_deploy)
#   - <role>/vars/secrets.yml            role-local secrets, auto-loaded by each role's first task (include_vars)
#
# To view/edit an encrypted file:
#   ansible-vault view   group_vars/all/vault.yml
#   ansible-vault edit   vaultwarden_deploy/vars/secrets.yml
#
# To encrypt a new secrets.yml you create by hand:
#   ansible-vault encrypt <role>/vars/secrets.yml
#
# cd $HOME/Documents/Tech/Configuration/Ansible-Playbook/docker
# ansible-playbook playbook.yaml -i inventory.yaml --key-file $HOME/.ssh/id_ed25519 --ask-vault-password

---
- name: Install Docker Homelab
  hosts: virtual_machines
  become: true
