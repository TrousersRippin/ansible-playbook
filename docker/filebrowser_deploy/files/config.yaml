---
# FileBrowser Quantum v2.x layout
http:
  port: 8005

server:
  # Relative paths resolve from /home/filebrowser, so keep these absolute
  database:
    path: "/home/filebrowser/data/database.sqlite"
  cacheDir: "/home/filebrowser/data/tmp"
  sources:
    - path: "/mnt/home-troy"
      name: Home
      config:
        defaultEnabled: true
    - path: "/mnt/host-opt"
      name: Opt
      config:
        defaultEnabled: true
    - path: "/mnt/host-mnt"
      name: Mnt
      config:
        defaultEnabled: true

auth:
  methods:
    password:
      enabled: true
      minLength: 8
      # Admin user defaults to "admin"; password comes from
      # FILEBROWSER_ADMIN_PASSWORD in .env (vault)
