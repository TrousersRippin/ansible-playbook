server:
  port: 8005
  database: "data/filebrowser.sqlite"
  cacheDir: "data/tmp"
  sources:
    - path: "/mnt/home-troy"
      name: Home
      config:
        defaultEnabled: true
    - path: "/mnt/host-opt"
      name: Opt
      config:
        defaultEnabled: true

auth:
  tokenExpirationHours: 2
  methods:
    password:
      enabled: true
      minLength: 8
  adminUsername: admin
