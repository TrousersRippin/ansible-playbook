---
- name: Include role secrets
  ansible.builtin.include_vars:
    file: secrets.yml

- name: Ensure Docker-Compose is installed
  ansible.builtin.package:
    name: "{{ 'docker-compose-v2' if ansible_facts.distribution == 'Ubuntu' else 'docker-compose' }}"
    state: present

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create a directory for container config storage
  ansible.builtin.file:
    path: "/opt/stacks/{{ APP }}/config"
    state: directory
    mode: '0755'
    owner: "{{ USER }}"
    group: "{{ USER }}"

- name: Create a directory for container log storage
  ansible.builtin.file:
    path: "/opt/stacks/{{ APP }}/logs"
    state: directory
    mode: '0755'
    owner: "{{ USER }}"
    group: "{{ USER }}"

- name: Create a directory for compose file
  ansible.builtin.file:
    path: "/opt/stacks/compose/{{ APP }}"
    state: directory
    mode: '0755'
    owner: "{{ USER }}"
    group: "{{ USER }}"

- name: Add compose file
  ansible.builtin.template:
    src: "templates/compose.yaml.j2"
    dest: "/opt/stacks/compose/{{ APP }}/compose.yaml"
    mode: '0644'
    owner: "{{ USER }}"
    group: "{{ USER }}"

- name: Add env file
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "/opt/stacks/compose/{{ APP }}/.env"
    mode: '0644'
    owner: "{{ USER }}"
    group: "{{ USER }}"

# Pull before touching systemd-resolved, while host DNS still works
- name: Check if image exists
  community.docker.docker_image:
    name: "{{ IMAGE_NAME }}"
    tag: "{{ IMAGE_TAG }}"
    source: pull

# Frees port 53 for the container
- name: Ensure DNSStubListener=no is set
  ansible.builtin.lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: '^#?DNSStubListener='
    line: 'DNSStubListener=no'
    create: true
    backup: true
  notify: Restart systemd-resolved

# Default stub-resolv.conf points at 127.0.0.53, which stops answering once the
# stub listener is off; use the upstream servers resolved learned instead
- name: Point /etc/resolv.conf at systemd-resolved upstream servers
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  notify: Restart systemd-resolved

- name: Apply systemd-resolved changes before binding port 53
  ansible.builtin.meta: flush_handlers

- name: Start container
  community.docker.docker_compose_v2:
    project_src: "/opt/stacks/compose/{{ APP }}"
    state: present
