# =============================================================================
# Unattended upgrades
# =============================================================================
- name: Enable unattended-upgrades via debconf
  ansible.builtin.debconf:
    name: unattended-upgrades
    question: unattended-upgrades/enable_auto_updates
    value: "true"
    vtype: boolean

- name: Configure unattended-upgrades (Debian)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-updates";
          "origin=Debian,codename=${distro_codename}-proposed-updates";
          "origin=Debian,codename=${distro_codename},label=Debian";
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Package-Blacklist {
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  when: ansible_distribution == 'Debian'

- name: Configure unattended-upgrades (Ubuntu)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "origin=Ubuntu,archive=${distro_codename}";
          "origin=Ubuntu,archive=${distro_codename}-updates";
          "origin=Ubuntu,archive=${distro_codename}-security";
          "origin=UbuntuESMApps,archive=${distro_codename}-apps-security";
          "origin=UbuntuESM,archive=${distro_codename}-infra-security";
      };
      Unattended-Upgrade::Package-Blacklist {
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  when: ansible_distribution == 'Ubuntu'

- name: Configure automatic update schedule
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Start and enable unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true

# =============================================================================
# systemd-resolved
# =============================================================================
- name: Create systemd-resolved config directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'

- name: Configure systemd-resolved
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/99-local.conf
    mode: '0644'
    content: |
      [Resolve]
      DNS={{ NAMESERVER }}
      FallbackDNS=1.1.1.1 1.0.0.1
      Domains={{ DOMAIN }}
      DNSSEC=allow-downgrade
      DNSOverTLS=no
      MulticastDNS=yes
      LLMNR=no
      Cache=yes
      CacheFromLocalhost=no
      DNSStubListener={{ 'no' if dns_server | default(false) | bool else 'yes' }}
      ReadEtcHosts=yes
      ResolveUnicastSingleLabel=no
      StaleRetentionSec=0

- name: Enable systemd-resolved
  ansible.builtin.service:
    name: systemd-resolved
    enabled: true

# NOTE: /etc/resolv.conf is commonly bind-mounted from the LXC host, so it
# can't be removed/relinked from inside the container (Device or resource
# busy). Skipping the relink on LXC and leaving whatever the host provides.
- name: Configure resolv.conf symlink
  ansible.builtin.file:
    src: "{{ '/run/systemd/resolve/resolv.conf' if dns_server | default(false) | bool else '/run/systemd/resolve/stub-resolv.conf' }}"
    dest: /etc/resolv.conf
    state: link
    force: true
  when: not is_lxc

# =============================================================================
# systemd-journald
# =============================================================================
- name: Create systemd-journald config directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Configure systemd-journald
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/journald.conf
    mode: '0644'
    content: |
      [Journal]
      Storage=persistent
      Compress=yes
      SystemMaxUse=500M
      SystemMaxFileSize=50M
      MaxRetentionSec=2week
      RateLimitInterval=30s
      RateLimitBurst=1000
      ForwardToKMsg=no
      ForwardToSyslog=no
      Seal=yes
      MaxMessageSize=64K
      SyncIntervalSec=5m

- name: Enable systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    enabled: true

# =============================================================================
# Kernel parameters
# =============================================================================
# NOTE: kernel.printk is not namespaced, so unprivileged LXC containers
# generally can't apply it (systemd-sysctl will log a failure at boot even
# though this copy task itself succeeds). Skipping entirely on LXC.
- name: Configure quiet console kernel parameters
  ansible.builtin.copy:
    dest: /etc/sysctl.d/00-console_quiet.conf
    mode: '0644'
    content: |
      kernel.printk=1 4 1 4
  failed_when: false
  when: not is_lxc

- name: Create systemd system.conf.d directory
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: '0755'

- name: Configure systemd quiet logging
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/quiet.conf
    mode: '0644'
    content: |
      [Manager]
      LogTarget=journal
      LogLevel=emerg

# =============================================================================
# Console
# =============================================================================
# NOTE: these target a real virtual console (/dev/tty0, framebuffer) that
# doesn't exist in an LXC container. Harmless to run, but a no-op, so
# skipping to save time/noise.
- name: Configure /etc/issue
  vars:
    os_color: "{{ '33' if ansible_distribution == 'Ubuntu' else '32' }}"
  ansible.builtin.copy:
    dest: /etc/issue
    mode: '0644'
    content: |
      \e[{{ os_color }}m\S\e[0m
      \e[37mKernel \r\e[0m
      \e[90m\d \t\e[0m
      \e[31m{{ ansible_default_ipv4.interface }}:\e[0m \4{{ '{' }}{{ ansible_default_ipv4.interface }}{{ '}' }}
      \e[36mconsole:\e[0m \l
  when: not is_lxc

- name: Configure keyboard layout
  ansible.builtin.lineinfile:
    path: /etc/default/keyboard
    regexp: '^XKBVARIANT='
    line: 'XKBVARIANT="mac_intl"'
  when: not is_lxc

- name: Configure console codeset
  ansible.builtin.lineinfile:
    path: /etc/default/console-setup
    regexp: '^CODESET='
    line: 'CODESET="Lat15"'
  when: not is_lxc

- name: Configure console font face
  ansible.builtin.lineinfile:
    path: /etc/default/console-setup
    regexp: '^FONTFACE='
    line: 'FONTFACE="Terminus"'
  when: not is_lxc

- name: Configure console font size
  ansible.builtin.lineinfile:
    path: /etc/default/console-setup
    regexp: '^FONTSIZE='
    line: 'FONTSIZE="8x16"'
  when: not is_lxc

# =============================================================================
# Systemd-boot
# =============================================================================
- name: Configure systemd-boot loader
  ansible.builtin.copy:
    dest: /boot/efi/loader/loader.conf
    mode: '0644'
    content: |
      timeout 3
      editor no
      console-mode keep
  when: efi_loader_dir.stat.exists

# =============================================================================
# Reboot
# =============================================================================
# NOTE: inside LXC this only restarts the container, and whether it comes
# back up depends on the host's restart policy for that container (e.g.
# Proxmox onboot/restart settings). If the host doesn't auto-restart it,
# Ansible just waits out reboot_timeout and fails. Skipping on LXC — restart
# the container from the host instead if you need this applied immediately.
- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: not is_lxc
