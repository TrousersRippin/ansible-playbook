---
- name: Create Ansible remote_tmp directory
  ansible.builtin.file:
    path: /root/.cache/ansible/tmp
    state: directory
    mode: '0700'

# =============================================================================
# Environment detection
# =============================================================================
- name: Set container flag
  ansible.builtin.set_fact:
    is_lxc: "{{ ansible_virtualization_type == 'lxc' }}"

- name: Check for systemd-boot EFI directory
  ansible.builtin.stat:
    path: /boot/efi/loader
  register: efi_loader_dir

# =============================================================================
# System
# =============================================================================
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure /etc/hosts
  ansible.builtin.copy:
    dest: /etc/hosts
    mode: '0644'
    content: |
      127.0.0.1   localhost
      127.0.1.1   {{ inventory_hostname }}   {{ inventory_hostname }}

# =============================================================================
# Package manager
# =============================================================================
- name: Configure apt sources.list (Debian)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    mode: '0644'
    content: |
      # See /etc/apt/sources.list.d/debian.sources
  when: ansible_distribution == 'Debian'

- name: Configure apt sources.list (Ubuntu)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    mode: '0644'
    content: |
      # See /etc/apt/sources.list.d/ubuntu.sources
  when: ansible_distribution == 'Ubuntu'

- name: Configure debian.sources
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/debian.sources
    mode: '0644'
    content: |
      Enabled: yes
      Types: deb
      URIs: https://deb.debian.org/debian/
      Suites: {{ ansible_distribution_release }} {{ ansible_distribution_release }}-updates
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

      Enabled: yes
      Types: deb
      URIs: https://security.debian.org/debian-security/
      Suites: {{ ansible_distribution_release }}-security
      Components: main contrib non-free non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
  when: ansible_distribution == 'Debian'

- name: Configure ubuntu.sources
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ubuntu.sources
    mode: '0644'
    content: |
      Enabled: yes
      Types: deb
      URIs: {{ 'https://ports.ubuntu.com/ubuntu-ports/' if ansible_architecture != 'x86_64' else 'https://archive.ubuntu.com/ubuntu/' }}
      Suites: {{ ansible_distribution_release }} {{ ansible_distribution_release }}-updates
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

      Enabled: yes
      Types: deb
      URIs: {{ 'https://ports.ubuntu.com/ubuntu-ports/' if ansible_architecture != 'x86_64' else 'https://security.ubuntu.com/ubuntu/' }}
      Suites: {{ ansible_distribution_release }}-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  when: ansible_distribution == 'Ubuntu'

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Upgrade distribution
  ansible.builtin.apt:
    upgrade: dist

# =============================================================================
# Timezone
# =============================================================================
- name: Set timezone
  ansible.builtin.timezone:
    name: "{{ TIMEZONE }}"

# =============================================================================
# User
# =============================================================================
- name: Generate password hash
  ansible.builtin.set_fact:
    hashed_password: "{{ NEW_USER_PASSWORD | password_hash('sha512') }}"

- name: Create group for new user
  ansible.builtin.group:
    name: "{{ NEW_USER_NAME }}"
    gid: 1000
    state: present

- name: Add user
  ansible.builtin.user:
    name: "{{ NEW_USER_NAME }}"
    comment: "{{ NEW_USER_FULLNAME }}"
    uid: 1000
    group: "{{ NEW_USER_NAME }}"
    shell: /bin/zsh
    create_home: true
    state: present
    groups: sudo
    append: true
    password: "{{ hashed_password }}"

# - name: Configure sudo privileges
#  ansible.builtin.copy:
#    dest: /etc/sudoers.d/admin
#    mode: '0440'
#    content: |
#      Defaults  !use_pty
#      Defaults  env_keep += "HOME"
#      %sudo     ALL=(ALL) NOPASSWD:ALL
#    validate: /usr/sbin/visudo -cf %s

# =============================================================================
# SSH
# =============================================================================
- name: Create SSH directory for root user
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    mode: '0700'

- name: Add SSH key to root user's authorized_keys
  ansible.builtin.authorized_key:
    user: root
    key: "{{ lookup('file', SSH_KEY_PATH) }}"
    state: present

- name: Create .ssh directory for new user
  ansible.builtin.file:
    path: /home/{{ NEW_USER_NAME }}/.ssh
    state: directory
    owner: "{{ NEW_USER_NAME }}"
    group: "{{ NEW_USER_NAME }}"
    mode: '0700'

- name: Add SSH key to new user's authorized_keys
  ansible.builtin.authorized_key:
    user: "{{ NEW_USER_NAME }}"
    key: "{{ lookup('file', SSH_KEY_PATH) }}"
    state: present

- name: Create SSH client config for new user
  ansible.builtin.copy:
    dest: /home/{{ NEW_USER_NAME }}/.ssh/config
    owner: "{{ NEW_USER_NAME }}"
    group: "{{ NEW_USER_NAME }}"
    mode: '0600'
    content: |
      Host *
          AddKeysToAgent yes
          IdentityFile ~/.ssh/id_ed25519
          Port 22
          User {{ NEW_USER_NAME }}

      Host {{ CLIENT }}
          HostName {{ CLIENT_IP }}

- name: Generate SSH keypair for new user
  ansible.builtin.openssh_keypair:
    path: /home/{{ NEW_USER_NAME }}/.ssh/id_ed25519
    type: ed25519
    comment: "{{ inventory_hostname }}"
    owner: "{{ NEW_USER_NAME }}"
    group: "{{ NEW_USER_NAME }}"
    mode: '0600'
    force: false

# =============================================================================
# SSHD
# =============================================================================
- name: Create custom SSHD config
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: '0600'
    content: |
      PermitRootLogin no
      PubkeyAuthentication yes
      PasswordAuthentication no
  notify: Restart ssh

# =============================================================================
# Packages
# =============================================================================
- name: Install packages
  ansible.builtin.apt:
    name:
      - console-setup
      - curl
      - git
      - gpg
      - tree
      - vim
      - wget
      - zsh
    state: present

- name: Install security packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - unattended-upgrades
      # - ufw
    state: present

# =============================================================================
# Fail2ban
# =============================================================================
# NOTE: fail2ban bans by manipulating iptables/nftables, which needs
# CAP_NET_ADMIN and netfilter kernel modules exposed into the container
# namespace. Unprivileged LXC containers often lack this, so bans can
# silently no-op even though the service itself starts fine. Skipping
# entirely on LXC; if you need this on privileged LXC, drop the guard
# and verify with `fail2ban-client status sshd` after a test ban.
- name: Create fail2ban jail.local
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    mode: '0644'
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 {{ CLIENT_IP }}
      bantime = 3600
      findtime = 600
      maxretry = 5

      [sshd]
      enabled = true
      backend = auto
  when: not is_lxc

- name: Start and enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: not is_lxc

