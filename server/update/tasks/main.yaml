---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
  register: apt_upgrade_result

- name: Display upgraded packages
  vars:
    upgraded_pkgs: "{{ apt_upgrade_result.stdout_lines | select('match', '^Inst ') | map('regex_replace', '^Inst (\\S+).*', '\\1') | join(', ') }}"
  ansible.builtin.debug:
    msg: "Packages upgraded on {{ inventory_hostname }}: {{ upgraded_pkgs }}"
  when: apt_upgrade_result.changed

- name: Remove packages that are no longer required
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Clean apt cache
  ansible.builtin.apt:
    clean: true

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file

- name: Read packages requesting a reboot
  ansible.builtin.slurp:
    src: /var/run/reboot-required.pkgs
  register: reboot_required_pkgs
  failed_when: false
  when: reboot_required_file.stat.exists

- name: Notify that a reboot is required
  vars:
    reboot_pkgs: "{{ (reboot_required_pkgs.content | default('') | b64decode).split() | unique | join(', ') }}"
  ansible.builtin.debug:
    msg: >-
      REBOOT REQUIRED on {{ inventory_hostname }} - please restart manually
      {{- (' (requested by: ' ~ reboot_pkgs ~ ')') if reboot_pkgs else '' }}
  when: reboot_required_file.stat.exists

- name: Display reboot status
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} does not require a reboot"
  when: not reboot_required_file.stat.exists
